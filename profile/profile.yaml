# List of Jarvis projects
jarvis_projects:
  - name: "Cluster Monitor"
    git_url: "/linux_sql"
    # The project description allows hiring managers to understand your project and technologies you used(e.g. programming languages, libraries, algorithms, hardware, tools, etc.).
    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description: >
      Built a Linux cluster monitoring agent that collects hardware specifications and system usage metrics,
      then stores them in a PostgreSQL database running in Docker. Implemented Bash scripts to capture CPU,
      memory, and disk statistics using Linux utilities, and scheduled recurring data collection using crontab.
      Designed and created the database schema using SQL, and provided analytics queries to help identify
      issues such as low memory and high CPU usage. Followed a GitFlow based workflow for structured development.

  - name: "Core Java Apps"
    git_url: "/core_java"
    # The project description allows hiring managers to understand your project and technologies you used(e.g. programming languages, libraries, algorithms, hardware, tools, etc.).
    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description: >
      Built a Java based grep application that searches files recursively for lines matching a regular expression
      and writes matches to an output file. Used Core Java, Java NIO for file traversal and reading, Pattern for
      regex matching, and SLF4J for logging. Packaged the application with Maven into a single runnable JAR and
      containerized it with Docker for consistent execution.

# List of personal or academic projects
# Feel free to add more projects
highlighted_projects:
    #project name
  - name: "Phishing Detection in the Gen-AI Era (Published Paper)"
    #URL is optional
    git_url: "https://arxiv.org/abs/2507.07406"
    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description: Published a comparative evaluation of classical ML/DL vs quantized small-parameter LLMs for phishing detection; benchmarked accuracy vs compute cost, tested zero-shot/few-shot prompting, and analyzed robustness under LLM-rephrased email attacks.
  - name: "Deep Learning Traffic Behavioral Profiling (Intrusion Detection)"
    git_url: "https://github.com/SerbanVoineaGabreanu/DLTrafficBehaviouralProfiling"
    description: Built an end-to-end intrusion detection system evaluated on IDS2018 (~16.2M rows, 80 features) with a Flask UI for CSV uploads (Wireshark > CICFlowMeter > prediction); achieved 98.4% accuracy and 97.9% F1 via a stacked MLP + Random Forest approach. 
  - name: "Human Scar Detection (Offline Multimodal CV + Local LLM)"
    git_url: "https://github.com/SerbanVoineaGabreanu/HumanScarDetection"
    description: Developed a privacy-first offline multimodal system combining a ConvNeXtV2 classifier with a local LLM for context analysis; trained on Fitzpatrick17k (16,577 images, 118 classes) and achieved 95% precision / 25% recall on surgical scars with macro precision/recall 0.542/0.533 across all classes. 
  - name: "AI Face Aging System (CycleGAN + Perceptual Loss)"
    git_url: "https://github.com/SerbanVoineaGabreanu/Facial-Age-Prediction-and-Image-Generation"
    description: Implemented CycleGAN-based facial age progression/regression with VGG19 perceptual loss to improve realism and identity retention; achieved SSIM 0.8303 (best at epoch 5) using early stopping to reduce overfitting. 
  - name: "AI Navigation Agent + Human vs AI Trials Platform"
    git_url:
    description: Built a Unity simulation with AI agents for autonomous navigation/spatial awareness in 3D hospital models; designed a dynamic memory system for LLM navigation and developed an automated evaluation platform to manage human vs AI trials using Python-Flask.
  - name: "Hybrid Cloud Simulation (CloudSim + Performance GUI)"
    git_url: "https://github.com/SerbanVoineaGabreanu/SimulatingHybridCloudInfrastructure"
    description: Modeled a hybrid cloud across 10 scenarios and built a GUI for performance analysis; varied public-cloud capacity (2-16 hosts, 10k-160k MIPS) over 40-200 cloudlets, yielding up to 34x faster public-data execution vs baseline in selected workloads.
  - name: "2D Space Video Game (Unity)"
    git_url:
    description: Built a 2D spaceship game featuring procedurally generated star systems, modular ships/weapons, dynamic ship AI, and real-time combat systems.

